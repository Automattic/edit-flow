# Configuration for Dependabot version updates
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      actions:
        patterns: ["*"]
    labels:
      - "dependencies"
    commit-message:
      prefix: "Actions"
      include: "scope"
    open-pull-requests-limit: 5

  # Maintain dependencies for Composer
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
    groups:
      dev-dependencies:
        patterns:
          - "automattic/*"
          - "dealerdirect/*"
          - "php-parallel-lint/*"
          - "phpcompatibility/*"
          - "phpunit/*"
          - "squizlabs/*"
          - "yoast/*"
    labels:
      - "dependencies"
    commit-message:
      prefix: "Composer"
      include: "scope"
    open-pull-requests-limit: 5
    versioning-strategy: increase-if-necessary

  # Maintain dependencies for npm
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "wednesday"
    groups:
      dev-dependencies:
        patterns:
          - "@wordpress/*"
          - "eslint*"
          - "prettier*"
          - "@types/*"
        exclude-patterns:
          - "eslint"
    labels:
      - "dependencies"
    commit-message:
      prefix: "npm"
      include: "scope"
    open-pull-requests-limit: 5
    ignore:
      # The following @wordpress/* packages are pinned to their last
      # React-18-compatible, CommonJS line until two follow-ups land:
      # a React 18 -> 19 upgrade and an ESM migration of the E2E harness.
      # Remove each entry once its blocker is cleared.
      #
      # components 34+ requires react ^19 as a peer dependency.
      - dependency-name: "@wordpress/components"
        update-types: ["version-update:semver-major"]
      # plugins 7.47+ transitively requires @wordpress/components ^34 (React 19).
      - dependency-name: "@wordpress/plugins"
        versions: [">=7.47.0"]
      # e2e-test-utils-playwright 1.47+ ships a raw ESM entry point that the
      # CommonJS tests/e2e/global-setup.js cannot require.
      - dependency-name: "@wordpress/e2e-test-utils-playwright"
        versions: [">=1.47.0"]

name: Integration Tests

on:
  push:
    paths:
      - '**.php'
      - 'composer.json'
      - 'composer.lock'
      - 'phpunit.xml.dist'
      - '.wp-env.json'
      - '.github/workflows/integration.yml'
  pull_request:
    branches: [develop, main]
    paths:
      - '**.php'
      - 'composer.json'
      - 'composer.lock'
      - 'phpunit.xml.dist'
      - '.wp-env.json'
      - '.github/workflows/integration.yml'
  workflow_dispatch:

# Disable all permissions by default; grant minimal permissions per job
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Alias 'master' to 'latest'
    name: WP ${{ matrix.wp == 'master' && 'latest' || matrix.wp }} and PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          # Check lowest supported WP version, with the lowest supported PHP.
          - php: '7.4'
            wp: '6.4'
          # Check latest WP with the latest PHP.
          - php: 'latest'
            wp: 'master'

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up NodeJS 20
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Put local node binaries on PATH
        run: echo "$GITHUB_WORKSPACE/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@accd6127cb78bee3e8082180cb391013d204ef9f # 2.37.0
        with:
          php-version: ${{ matrix.php }}
          tools: composer

      - name: Install Composer dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
        with:
          composer-options: --prefer-dist --no-progress

      - name: Cache wp-env downloads
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/wp-env
          key: wp-env-${{ runner.os }}-${{ matrix.wp }}-${{ matrix.php }}-${{ hashFiles('.wp-env.json') }}
          restore-keys: |
            wp-env-${{ runner.os }}-${{ matrix.wp }}-${{ matrix.php }}-
            wp-env-${{ runner.os }}-${{ matrix.wp }}-

      - name: Setup wp-env
        run: npx wp-env start
        env:
          WP_ENV_CORE: WordPress/WordPress#${{ matrix.wp }}

      - name: Run PHPUnit tests (single site)
        run: composer test:integration

      - name: Run PHPUnit tests (multisite)
        run: composer test:integration-ms

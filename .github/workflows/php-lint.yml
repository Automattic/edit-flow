name: PHP Lint

on:
  push:
    paths:
      - '**.php'
      - 'composer.json'
      - 'composer.lock'
      - '.phpcs.xml.dist'
      - '.github/workflows/php-lint.yml'
  pull_request:
    branches: [develop, main]
    paths:
      - '**.php'
      - 'composer.json'
      - 'composer.lock'
      - '.phpcs.xml.dist'
      - '.github/workflows/php-lint.yml'
  workflow_dispatch:

# Disable all permissions by default; grant minimal permissions per job
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: PHP Syntax and Coding Standards
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.2'
          tools: composer, cs2pr

      - name: Install Composer dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
        with:
          composer-options: --prefer-dist --no-progress

      - name: Cache PHPCS results
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .phpcs-cache
          key: phpcs-${{ runner.os }}-${{ hashFiles('.phpcs.xml.dist', 'composer.json') }}-${{ github.sha }}
          restore-keys: |
            phpcs-${{ runner.os }}-${{ hashFiles('.phpcs.xml.dist', 'composer.json') }}-
            phpcs-${{ runner.os }}-

      - name: PHP syntax lint
        run: composer lint-ci | cs2pr

      - name: PHP coding standards
        run: composer cs -- --cache=.phpcs-cache --report=checkstyle | cs2pr
